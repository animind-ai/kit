[project]
name = "animind-kit"
version = "0.1.0"
description = "scene-spec 的运行时：主题、组件、布局、编译后端（默认墨线 moxian，可选 Manim） · Runtime for scene-spec (moxian by default, Manim optional)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Boxi Yu" }]
requires-python = ">=3.11,<3.13"
dependencies = [
  "manim==0.21.0",
  "moxian @ git+https://github.com/animind-ai/moxian@v0.0.2",
  "Pygments>=2.17",
  "PyYAML>=6.0",
  "scene-spec @ git+https://github.com/animind-ai/scene-spec@v0.2.0",
  "zh-math-reading @ git+https://github.com/animind-ai/zh-math-reading@v0.1.0",
]

[project.scripts]
animind-kit = "animind_kit.cli:main"

[tool.uv.sources]
scene-spec = { path = "../scene-spec", editable = true }
moxian = { path = "../moxian", editable = true }
zh-math-reading = { path = "../zh-math-reading", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# 同级仓库按 git tag 依赖（未发布到 PyPI）；本地开发仍走 [tool.uv.sources] 的相对路径
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/animind_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".moxian-cache", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B905"]
