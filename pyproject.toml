[project]
name = "animind-kit"
version = "0.1.0"
description = "scene-spec 的 Manim 运行时：主题、组件、布局、编译后端"
readme = "README.md"
license = "MIT"
authors = [{ name = "Boxi Yu" }]
requires-python = ">=3.11,<3.13"
dependencies = [
  "manim==0.21.0",
  "moxian",
  "PyYAML>=6.0",
  "scene-spec",
]

[project.scripts]
animind-kit = "animind_kit.cli:main"

[tool.uv.sources]
scene-spec = { path = "../scene-spec", editable = true }
moxian = { path = "../moxian", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animind_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".moxian-cache", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B905"]
